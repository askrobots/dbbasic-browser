<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>dbbasic-browser</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; font: 13px -apple-system, system-ui, sans-serif; }
      body { display: flex; flex-direction: column; background: #1e1e22; color: #e8e8ea; }
      #bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #26262b; border-bottom: 1px solid #000; }
      #url { flex: 1; padding: 7px 12px; border-radius: 7px; border: 1px solid #3a3a40; background: #131316; color: #e8e8ea; font-size: 13px; }
      #back, #fwd, #reload { min-width: 36px; height: 32px; display: inline-flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; }
      #url:focus { outline: none; border-color: #5b8cff; }
      .btn { padding: 7px 10px; border-radius: 7px; border: 1px solid #3a3a40; background: #131316; color: #e8e8ea; cursor: pointer; white-space: nowrap; }
      .btn:hover { background: #1c1c20; }
      .btn.on { background: #23324e; border-color: #3a5a9a; color: #cde0ff; }
      #inspectBtn { position: relative; }
      #inspectCount { position: absolute; top: -6px; right: -6px; background: #5b8cff; color: #fff; border-radius: 999px; font-size: 10px; min-width: 16px; height: 16px; padding: 0 4px; display: none; align-items: center; justify-content: center; }
      #meter { font-variant-numeric: tabular-nums; padding: 6px 10px; border-radius: 7px; background: #10240f; color: #7ee787; border: 1px solid #1c4a1a; white-space: nowrap; }
      #meter.zero { background: #131316; color: #8a8a90; border-color: #2a2a30; }
      #bal { font-variant-numeric: tabular-nums; padding: 6px 10px; border-radius: 7px; background: #131316; color: #8a8a90; border: 1px solid #2a2a30; white-space: nowrap; cursor: pointer; }
      #bal.funded { color: #cde0ff; border-color: #3a5a9a; }
      #bal:hover { background: #1c1c20; }
      #mbal { font-variant-numeric: tabular-nums; padding: 6px 10px; border-radius: 7px; background: #131316; color: #8a8a90; border: 1px solid #2a2a30; white-space: nowrap; }
      #mbal.earning { color: #7ee787; border-color: #1c4a1a; }
      .txlink { color: #7aa2ff; cursor: pointer; text-decoration: underline; }
      #main { flex: 1; display: flex; min-height: 0; }
      #findBar { position: absolute; top: 8px; right: 18px; z-index: 15; display: none; align-items: center; gap: 6px; padding: 6px 8px; background: #1e1e24; border: 1px solid #3a3a40; border-radius: 9px; box-shadow: 0 8px 28px rgba(0,0,0,.5); }
      #findBar.open { display: flex; }
      #findIn { width: 230px; padding: 6px 9px; border-radius: 6px; border: 1px solid #3a3a40; background: #131316; color: #e8e8ea; font-size: 13px; }
      #findIn:focus { outline: none; border-color: #5b8cff; }
      #findBar.none #findIn { border-color: #8a3a3a; }
      #findCount { min-width: 74px; text-align: right; color: #9a9aa2; font-size: 12px; font-variant-numeric: tabular-nums; }
      #findBar .btn { padding: 4px 9px; }
      #pages { flex: 1; position: relative; min-width: 0; }
      /* Inactive tabs stay full-size (so pages lay out correctly) but are hidden. */
      .pg { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
      .pg.hidden { visibility: hidden; pointer-events: none; }
      #tabbar { display: flex; align-items: flex-end; gap: 4px; padding: 6px 10px 0; background: #1a1a1e; }
      #tabs { display: flex; gap: 2px; min-width: 0; overflow: hidden; }
      /* width (not just flex-basis) so the container is sized from 200px, not from the full title text */
      .tab { display: flex; align-items: center; gap: 6px; flex: 0 1 200px; width: 200px; min-width: 72px; padding: 6px 6px 6px 12px; border-radius: 8px 8px 0 0; background: #202024; color: #8a8a90; cursor: pointer; user-select: none; }
      .tab:hover { background: #232328; }
      .tab.on { background: #26262b; color: #e8e8ea; }
      .tab .tt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      :root { --throb-accent: #5b8cff; --throb-ok: #7ee787; --throb-fail: #ff8a8a; }
      .tab .th { flex: none; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; color: #7ee787; font-size: 11px; }
      .th svg { width: 16px; height: 16px; display: block; }
      .tab:not(.on) .th svg { opacity: .8; }
      #sbar { flex: none; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; background: #26262b; border-top: 1px solid #000; font-size: 12px; color: #c8c8ce; }
      #sbar .btn, #sbar #bal, #sbar #mbal, #sbar #meter, #sbar #ctlChip { padding: 2px 9px; border-radius: 5px; font-size: 12px; line-height: 18px; }
      #sbar #meter::before { content: "Paid "; opacity: .75; }
      #sbar #mbal::before { content: "Merchant "; opacity: .75; }
      #sbar #inspectCount { position: static; display: inline-flex; margin-left: 5px; vertical-align: 1px; }
      #sleft { flex: 1; min-width: 0; display: flex; align-items: center; }
      #status { display: none; align-items: center; gap: 7px; min-width: 0; }
      #status.show { display: flex; }
      #cn { display: none; padding: 2px 9px; background: #7a1f1f; color: #fff; border-radius: 5px; font-size: 12px; font-weight: 600; white-space: nowrap; }
      #cn.show { display: block; }
      #link { display: none; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #link.show { display: block; }
      #link.show + #status { display: none; } /* a link you point at is shown instead of the page's status, as it always was */
      #link .k { font-weight: 600; margin-right: 6px; }
      #link.same { color: #8fd19e; }  /* same site: green */
      #link.other { color: #f0c674; } /* another site: amber */
      #status .ic { flex: none; width: 16px; height: 16px; }
      #status .ic svg { width: 16px; height: 16px; display: block; }
      #status .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
      .tab .x { opacity: .55; border-radius: 4px; padding: 0 5px; line-height: 16px; }
      .tab .x:hover { background: #3a3a40; opacity: 1; }
      #newTab { margin-bottom: 3px; padding: 2px 9px; }
      #ctlChip { padding: 6px 10px; border-radius: 7px; background: #2a1f0a; color: #f0c674; border: 1px solid #5a4514; white-space: nowrap; font-size: 12px; }
      #keyBtn { position: relative; }
      #keyDot { position: absolute; top: -3px; right: -3px; width: 9px; height: 9px; border-radius: 50%; background: #55555c; border: 2px solid #26262b; }
      #keyBtn.unlocked #keyDot { background: #7ee787; }
      #offerbar { display: none; align-items: center; gap: 8px; padding: 7px 12px; background: #1a2033; border-bottom: 1px solid #2a3a66; color: #cde0ff; font-size: 12px; flex-wrap: wrap; }
      #offerbar.show { display: flex; }
      #offerbar .msg { flex: 1; min-width: 160px; }
      #offerbar .msg b { color: #fff; font-weight: 600; }
      .sbtn { padding: 4px 10px; border-radius: 6px; border: 1px solid #3a5a9a; background: #23324e; color: #cde0ff; cursor: pointer; font-size: 12px; }
      .sbtn:hover { background: #2b3d5e; }
      .sbtn.quiet { background: transparent; border-color: #3a3a40; color: #9a9aa2; }
      #vaultPanel { position: fixed; top: 84px; right: 10px; width: 350px; max-height: calc(100vh - 100px); overflow: auto; z-index: 20; background: #1e1e24; border: 1px solid #3a3a40; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.55); padding: 12px; display: none; }
      #vaultPanel.open { display: block; }
      #vaultPanel h4 { margin: 0 0 8px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
      #vaultPanel h4 .sp { flex: 1; }
      #vaultPanel .sec { margin: 12px 0 4px; color: #7a7a82; font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
      #vaultPanel input { width: 100%; padding: 6px 9px; margin: 3px 0; border-radius: 6px; border: 1px solid #3a3a40; background: #131316; color: #e8e8ea; font-size: 12px; }
      #vaultPanel input:focus { outline: none; border-color: #5b8cff; }
      #vaultPanel .row2 { display: flex; gap: 6px; align-items: center; }
      #vaultPanel .hint { color: #8a8a90; font-size: 11.5px; line-height: 1.5; margin: 4px 0; }
      #vaultPanel .err { color: #ff9a9a; font-size: 11.5px; margin: 4px 0; }
      .cred { display: flex; align-items: center; gap: 6px; padding: 6px 8px; margin: 3px 0; background: #17171b; border: 1px solid #2a2a30; border-radius: 7px; }
      .cred .who { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
      .cred .who small { display: block; color: #7a7a82; font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; }
      .cred .x { cursor: pointer; opacity: .5; padding: 0 4px; } .cred .x:hover { opacity: 1; color: #ff9a9a; }
      /* ---- bookmarks ---- */
      #starBtn { min-width: 34px; font-size: 16px; line-height: 1; }
      #starBtn.saved { color: #f0c674; }
      #starBtn.site { color: #f0c674; box-shadow: inset 0 0 0 1px #8a6a1a; } /* this page is not saved, another on the same site is */
      #omni { position: fixed; z-index: 30; background: #1e1e24; border: 1px solid #3a3a40; border-radius: 9px; box-shadow: 0 12px 40px rgba(0,0,0,.6); padding: 5px; display: none; font-size: 13px; max-height: 70vh; overflow: auto; }
      #omni.open { display: block; }
      #omni .or { display: flex; align-items: baseline; gap: 9px; padding: 6px 9px; border-radius: 6px; cursor: pointer; color: #e8e8ea; white-space: nowrap; overflow: hidden; }
      #omni .or.sel { background: #2f3a52; }
      #omni .or .ic { width: 18px; text-align: center; flex: none; color: #9a9aa2; }
      #omni .or .tt { overflow: hidden; text-overflow: ellipsis; }
      #omni .or .u { color: #8a8a90; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
      #omni .or .k { color: #9cc3ff; font-size: 11px; flex: none; margin-left: auto; }
      #omni .of { color: #6f6f76; font-size: 11px; padding: 6px 9px 3px; border-top: 1px solid #2c2c32; margin-top: 4px; display: flex; gap: 8px; }
      #omni .of a { color: #8fb3e8; cursor: pointer; }
      #omni .or[data-kind="notice"] { color: #f0c674; cursor: default; white-space: normal; }
      #omni .or[data-kind="notice"].link { cursor: pointer; }
      #omni .or .p { color: #f08a7a; font-size: 11.5px; }
      #chatLog .cmd { background: #15201a; border: 1px solid #24402c; border-radius: 9px; padding: 8px 10px; font-size: 12.5px; color: #d8e8dc; max-width: 96%; }
      #chatLog .cmd .typed { font: 12px/1.4 ui-monospace, Menlo, monospace; color: #9cc3ff; word-break: break-word; }
      #chatLog .cmd .s { color: #e8e8ea; margin-top: 3px; word-break: break-word; }
      #chatLog .cmd a, .note a { color: #9cc3ff; cursor: pointer; text-decoration: underline; margin-left: 6px; }
      #chatLog .cmd ol { margin: 6px 0 0; padding-left: 20px; } #chatLog .cmd li { margin: 2px 0; word-break: break-word; }
      #chatLog .cmd li a { margin-left: 0; } #chatLog .cmd li .g { color: #8a8a90; font-size: 10.5px; text-transform: uppercase; letter-spacing: .03em; margin-right: 6px; }
      #chatLog .cmd details { margin-top: 6px; } #chatLog .cmd summary { color: #8a8a90; cursor: pointer; font-size: 11.5px; }
      #chatLog .cmd pre { margin: 4px 0 0; max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-word; color: #c8c8cc; font: 11.5px/1.45 ui-monospace, Menlo, monospace; }
      #bmPanel { position: fixed; top: 84px; right: 10px; width: 420px; max-height: calc(100vh - 100px); overflow: auto; z-index: 20; background: #1e1e24; border: 1px solid #3a3a40; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.55); padding: 12px; display: none; font-size: 12.5px; }
      #bmPanel.open { display: block; }
      #bmPanel h4 { margin: 0 0 4px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
      #bmPanel h4 .sp { flex: 1; }
      #bmPanel .sub { color: #8a8a90; font-size: 11px; margin-bottom: 8px; }
      #bmPanel input { width: 100%; box-sizing: border-box; padding: 6px 9px; margin: 2px 0 8px; border-radius: 6px; border: 1px solid #3a3a40; background: #131316; color: #e8e8ea; font-size: 12px; }
      #bmPanel .bm { display: block; padding: 6px 4px; border-radius: 6px; cursor: pointer; }
      #bmPanel .bm:hover { background: #26262b; }
      #bmPanel .bm .t { color: #e8e8ea; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #bmPanel .tabs2 { display: flex; gap: 6px; margin: 0 0 8px; }
      #bmPanel .tabs2 button.on { background: #23324e; border-color: #3a5a9a; color: #cde0ff; }
      #bmPanel .bm .s { color: #9a9aa2; font-size: 11px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #bmPanel .bm .h { color: #7a7a82; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #bmPanel .note { color: #8a8a90; font-size: 11.5px; line-height: 1.5; padding: 6px 2px; }
      #bmPanel .err { color: #ff9a9a; font-size: 11.5px; padding: 4px 2px; }
      /* ---- resource status ---- */
      #resBtn { font-variant-numeric: tabular-nums; white-space: nowrap; }
      #resBtn.warn { color: #f0c674; border-color: #5a4514; background: #2a1f0a; }
      #resPanel { position: fixed; bottom: 36px; right: 10px; width: 420px; max-height: calc(100vh - 130px); overflow: auto; z-index: 20; background: #1e1e24; border: 1px solid #3a3a40; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.55); padding: 12px; display: none; font-size: 12px; }
      #resPanel.open { display: block; }
      #resPanel h4 { margin: 0 0 6px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
      #resPanel h4 .sp { flex: 1; }
      #resPanel .sec { margin: 12px 0 4px; color: #7a7a82; font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
      #resPanel .tot { color: #c8c8ce; line-height: 1.6; }
      #resPanel .trow { padding: 6px 0; border-bottom: 1px solid #2a2a30; }
      #resPanel .trow .t1 { display: flex; align-items: center; gap: 6px; }
      #resPanel .trow .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #e8e8ea; }
      #resPanel .trow .mb { color: #c8c8ce; font-variant-numeric: tabular-nums; }
      #resPanel .trow.hot .mb { color: #f0c674; font-weight: 700; }
      #resPanel .bar { height: 4px; border-radius: 2px; background: #131316; margin: 4px 0 3px; overflow: hidden; }
      #resPanel .bar i { display: block; height: 100%; background: #5b8cff; }
      #resPanel .trow.hot .bar i { background: #f0c674; }
      #resPanel .t2 { color: #8a8a90; font-size: 11px; }
      #resPanel .hint { color: #8a8a90; font-size: 11px; line-height: 1.5; margin-top: 8px; }
      /* ---- assistant chat panel ---- */
      #chat { width: 380px; flex: none; background: #17171b; border-left: 1px solid #000; display: none; flex-direction: column; min-height: 0; }
      #chat.open { display: flex; }
      #chatHead { display: flex; align-items: center; gap: 6px; padding: 9px 12px; border-bottom: 1px solid #2a2a30; font-weight: 600; }
      #chatHead .sub { color: #8a8a90; font-weight: 400; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
      #chatHead select { background: #131316; color: #c8c8ce; border: 1px solid #2a2a30; border-radius: 6px; font-size: 11px; padding: 2px 4px; }
      #chatConn { padding: 6px 12px; border-bottom: 1px solid #2a2a30; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
      #chatConn:empty { display: none; }
      #chatConn .cn { display: flex; align-items: center; gap: 8px; color: #9a9aa2; }
      #chatConn .cn .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #chatConn .cn .dot { width: 8px; height: 8px; border-radius: 50%; background: #55555c; flex: none; }
      #chatConn .cn.on { color: #c8c8ce; } #chatConn .cn.on .dot { background: #7ee787; }
      #chatConn .cn.wait .dot { background: #f0c674; }
      #chatConn .er { color: #ff9a9a; font-size: 11.5px; line-height: 1.4; }
      #chatLog { flex: 1; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
      #chatLog .m { padding: 8px 10px; border-radius: 9px; white-space: pre-wrap; word-break: break-word; line-height: 1.45; font-size: 13px; }
      #chatLog .u { background: #23324e; color: #e8f0ff; align-self: flex-end; max-width: 92%; }
      #chatLog .a { background: #1e1e24; border: 1px solid #2a2a30; color: #e8e8ea; max-width: 96%; }
      #chatLog .step { color: #8a8a90; font-size: 11.5px; padding: 0 4px; font-family: ui-monospace, Menlo, monospace; word-break: break-word; }
      #chatLog .step.ok { color: #7ee787; } #chatLog .step.bad { color: #ff9a9a; }
      #chatLog .note { color: #8a8a90; font-size: 11.5px; text-align: center; padding: 2px 6px; }
      #chatLog .ask { background: #1a2033; border: 1px solid #3a5a9a; border-radius: 9px; padding: 9px 10px; font-size: 12.5px; color: #cde0ff; }
      #chatLog .ask.danger { background: #2a1f0a; border-color: #8a6a1a; color: #f4dca0; }
      #chatLog .ask .what { margin: 4px 0 8px; color: #fff; word-break: break-word; }
      #chatLog .ask .tag { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; opacity: .85; }
      #chatLog .ask .row2 { display: flex; gap: 6px; }
      #chatLog .ask.done { opacity: .6; } #chatLog .ask.done .row2 { display: none; }
      #chatEmpty { color: #6a6a72; padding: 22px 12px; text-align: center; font-size: 12px; line-height: 1.7; }
      #chatForm { display: flex; gap: 6px; padding: 8px 10px 4px; border-top: 1px solid #2a2a30; }
      #chatIn { flex: 1; resize: none; height: 54px; padding: 7px 9px; border-radius: 8px; border: 1px solid #3a3a40; background: #131316; color: #e8e8ea; font: inherit; font-size: 13px; }
      #chatIn:focus { outline: none; border-color: #5b8cff; }
      #chatPriv { color: #6a6a72; font-size: 10.5px; padding: 0 12px 8px; line-height: 1.4; }
      #inspector { width: 400px; flex: none; background: #17171b; border-left: 1px solid #000; display: none; flex-direction: column; }
      #inspector.open { display: flex; }
      #insHead { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid #2a2a30; font-weight: 600; }
      #insHead .sub { color: #8a8a90; font-weight: 400; font-size: 12px; margin-left: auto; }
      .insTab { border: 1px solid #2a2a30; background: #131316; color: #8a8a90; font-size: 11px; padding: 3px 9px; border-radius: 6px; cursor: pointer; font-weight: 600; }
      .insTab.on { background: #23324e; border-color: #3a5a9a; color: #cde0ff; }
      .histrow { display: flex; align-items: center; gap: 8px; padding: 8px 11px; background: #1e1e24; border: 1px solid #2a2a30; border-radius: 8px; }
      .histrow .t { color: #7a7a82; font-variant-numeric: tabular-nums; font-size: 11px; white-space: nowrap; }
      .histrow .h { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #c8c8ce; }
      .histrow .p { font-variant-numeric: tabular-nums; }
      #histTotal { padding: 8px 11px; color: #8a8a90; font-size: 12px; border-bottom: 1px solid #2a2a30; }
      #insList { overflow: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
      #insEmpty { color: #6a6a72; padding: 24px 12px; text-align: center; font-size: 12px; line-height: 1.6; }
      .row { background: #1e1e24; border: 1px solid #2a2a30; border-radius: 9px; overflow: hidden; }
      .row > .top { display: flex; align-items: center; gap: 8px; padding: 9px 11px; cursor: pointer; }
      .row .path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: #c8c8ce; }
      .row .price { font-variant-numeric: tabular-nums; color: #e8e8ea; }
      .pill { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
      .pill.paid { background: #10240f; color: #7ee787; }
      .pill.quoted { background: #201a0a; color: #f0c674; }
      .pill.prompt { background: #1a2033; color: #9ab4ff; }
      .pill.refused { background: #241010; color: #ff9a9a; }
      .detail { display: none; border-top: 1px solid #2a2a30; padding: 9px 11px; font-size: 11.5px; }
      .row.open .detail { display: block; }
      .detail dl { display: grid; grid-template-columns: 96px 1fr; gap: 3px 10px; margin: 0; }
      .detail dt { color: #7a7a82; }
      .detail dd { margin: 0; font-family: ui-monospace, Menlo, monospace; font-size: 11px; word-break: break-all; color: #cdcdd3; }

      #toast { position: fixed; right: 14px; bottom: 40px; display: flex; flex-direction: column; gap: 6px; z-index: 10; }
      .note { padding: 8px 12px; border-radius: 8px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.4); animation: in .15s ease-out; }

    </style>
  </head>
  <body>

        </div>
        <div id="insList"><div id="insEmpty">No x402 activity yet.<br />Load a page that returns 402 Payment Required — every challenge, decision, and payment shows up here.</div></div>

    </div>
    <!-- The status bar: what the page is doing on the left; what the browser is spending (memory, money) on the right. -->
    <div id="sbar">
      <div id="sleft"><div id="link"></div><div id="status"><span class="ic"></span><span class="tx"></span></div></div>
      <div id="cn">Caller network ON · this browser fetches nothing itself</div>
      <div id="ctlChip" style="display:none"></div>
      <button class="btn" id="resBtn" title="What the browser is using: memory, CPU, data, disk">Memory …</button>
      <button class="btn" id="inspectBtn" title="x402 inspector: every payment request, decision and payment">⚡ x402<span id="inspectCount">0</span></button>
      <div id="bal" class="chip" title="Your wallet USDC on Base Sepolia — click to copy address">◈ —</div>
      <div id="mbal" title="Merchant wallet — live payments land here" style="display:none">🏪 —</div>
      <button class="btn" id="refundBtn" title="Refund merchant → you" style="display:none">Refund</button>
      <button class="btn" id="fundBtn" title="Copy address + open the faucet">Fund</button>

    </div>
    <div id="toast"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      const urlInput = $("url");
      let omniEditing = false; // true while you are typing in the address bar (pages loading meanwhile do not overwrite it)

      // ---- tabs ------------------------------------------------------------
      // One <webview> per tab. Each tab owns its inspector rows so payment history
      // follows the page that caused it, not whichever tab happens to be in front.
      const tabs = [];
      let active = null;
      let nextTabId = 1;
      let rows = new Map(); // alias for the active tab's inspector rows
      const owners = new Map(); // resource URL -> tab that triggered it

      const shown = (u) => (u && !u.startsWith("about:") && !u.startsWith("data:") && !u.startsWith("dbb-reader:") ? u : "");

      function newTab(url, activate = true) {
        const wv = document.createElement("webview");
        wv.className = "pg hidden";
        wv.setAttribute("src", "about:blank");
        wv.setAttribute("allowpopups", ""); // main's windowOpenHandler turns these into tabs
        if (window.x402.webviewPreload) wv.setAttribute("preload", window.x402.webviewPreload);
        const tab = { id: nextTabId++, wv, wcId: null, url: "", title: "", rows: new Map(), userClosed: false, paid: false, ready: false, pending: null, loading: false, saveOffer: null, fillOffer: null, waiters: [], navSeen: false,
          el: null, reader: null, aiBusy: null, net: { reqs: new Map() }, lastActivity: 0, stats: { requests: 0, bytes: 0, hosts: new Set(), redirects: [], answered: 0, errorStatus: 0, cancelled: 0, failures: [], statusExamples: [] }, redirect: null, settledUntil: 0, failed: null, netError: null, thState: null, thText: "", find: { open: false, text: "", count: "" } };

        // Navigate only once the webview is really ready — setting src at creation
        // races its own init and can leave us stranded on about:blank.
        wv.addEventListener("dom-ready", () => {
          tab.ready = true;
          try { tab.wcId = wv.getWebContentsId(); } catch {}
          syncTabs(); // the automation API addresses pages by this id: publish it the moment it exists
          if (tab.pending) { const p = tab.pending; tab.pending = null; wv.src = p; }
        });
        wv.addEventListener("ipc-message", (e) => { if (e.channel === "link-hover") { tab.hoverLink = typeof e.args[0] === "string" ? e.args[0] : null; if (tab === active) paintLink(); } });
        wv.addEventListener("did-start-loading", () => { tab.loading = true; refreshThrobber(tab); syncTabs(); if (tab === active) paintReload(); });
        wv.addEventListener("did-fail-load", (e) => {
          if (!e.isMainFrame || e.errorCode === -3) return; // -3 = aborted (a newer navigation replaced it)
          tab.failed = { code: e.errorCode, desc: tab.netError || String(e.errorDescription || "").replace(/^net::/, "") };
          refreshThrobber(tab);
        });
        wv.addEventListener("did-stop-loading", () => {
          tab.loading = false;
          refreshThrobber(tab);
          if (tab === active) paintReload();
          syncTabs();
          if (tab.navSeen && tab.waiters.length) { // automation is waiting for this navigation to finish
            const ws = tab.waiters; tab.waiters = [];
            for (const w of ws) w({ loaded: true });
          }
        });
        // Reset this tab's inspector when navigation STARTS — the page's payment events
        // fire during the load, so resetting on did-navigate (after) would wipe them.
        wv.addEventListener("did-start-navigation", (e) => {
          if (e.isMainFrame) { tab.hoverLink = null; if (tab === active) paintLink(); } // the page we were pointing into is going away
          if (!e.isMainFrame || e.isInPlace) return;
          if (e.url.startsWith("chrome-error:")) return; // Chromium's own error page: keep the failure that caused it
          if (e.url !== "about:blank") tab.navSeen = true;
          if (shown(e.url)) tab.url = e.url;
          tab.rows.clear();
          tab.paid = false;
          tab.failed = null; tab.netError = null; tab.redirect = null; tab.settledUntil = 0;
          tab.lastActivity = Date.now(); // a navigation starting is network activity (it restarts the quiet clock)
          // Requests that predate this navigation belong to the page we're leaving. Chromium doesn't tell
          // our handler they were abandoned, so drop them here (the small margin keeps the new page's own
          // first request, whose net event can race this one).
          for (const [id, r] of tab.net.reqs) if (r.t0 < Date.now() - 150) tab.net.reqs.delete(id);
          refreshThrobber(tab);
          tab.userClosed = false; // new page — allow auto-open again
          if (tab.find.count) { tab.find.count = ""; tab.find.none = false; if (tab === active) paintFind(); } // the matches were on the page we left
          tab.fillOffer = null; // a save offer deliberately survives: login → redirect → "save?"
          if (tab.saveOffer) { // …but not into a different site
            let same = false;
            try { same = new URL(e.url).origin === tab.saveOffer.origin; } catch {}
            if (!same && shown(e.url)) { window.x402.vault.dismiss(tab.wcId); tab.saveOffer = null; }
          }
          renderTabs();
          if (tab === active) renderOffer();
          if (tab === active) renderInspector();
        });
        const onNav = (e) => {
          if (!shown(e.url)) return;
          tab.url = e.url;
          if (tab === active && !omniEditing) urlInput.value = e.url;
        };
        wv.addEventListener("did-navigate", onNav);
        wv.addEventListener("did-navigate-in-page", (e) => { if (e.isMainFrame) onNav(e); });
        wv.addEventListener("page-title-updated", (e) => { tab.title = e.title; renderTabs(); });
        wv.addEventListener("found-in-page", (e) => {
          const r = e.result || {};
          if (typeof r.matches !== "number") return;
          tab.find.count = r.matches ? (r.activeMatchOrdinal || 1) + " of " + r.matches : "No matches";
          tab.find.none = !r.matches;
          if (tab === active) paintFind();
        });
        // a new page under an open find bar: look again once it has loaded
        wv.addEventListener("did-stop-loading", () => { if (tab.find.open && tab.find.text && tab.find.loadedFor !== tab.url) { tab.find.loadedFor = tab.url; findRun(tab, 0); } });

        $("pages").appendChild(wv);
        tabs.push(tab);
        if (activate) switchTo(tab); else renderTabs();
        if (url) go(url, tab);
        return tab;
      }

      function switchTo(tab) {
        active = tab;
        for (const t of tabs) t.wv.classList.toggle("hidden", t !== tab);
        rows = tab.rows;
        setUrlBar(tab);
        renderTabs();
        refreshThrobber(tab);
        paintReload();
        renderInspector();
        renderOffer();
        if (vaultPanelOpen) renderVaultPanel();
        paintFind();
        if (!tab.url) urlInput.focus();
      }

      // ---- find in page: the page's own find, per tab; nothing leaves the machine ----
      const findBar = $("findBar"), findIn = $("findIn");
      function paintFind() {
        const f = active ? active.find : { open: false };
        findBar.classList.toggle("open", !!f.open);
        if (!f.open) return;
        if (document.activeElement !== findIn) findIn.value = f.text;
        $("findCount").textContent = f.text ? f.count : "";
        findBar.classList.toggle("none", !!(f.text && f.none));
      }
      // dir 0: a new search for what is typed; 1 / -1: the next or previous match of it
      function findRun(tab, dir) {
        const q = tab.find.text;
        if (!q) { try { tab.wv.stopFindInPage("clearSelection"); } catch {} tab.find.count = ""; tab.find.none = false; if (tab === active) paintFind(); return; }
        if (dir === 0) tab.find.loadedFor = tab.url;
        try { tab.wv.findInPage(q, { forward: dir !== -1, findNext: dir === 0 }); } catch {}
      }
      function openFind() {
        if (!active) return;
        active.find.open = true;
        paintFind();
        findIn.value = active.find.text;
        findIn.focus(); findIn.select();
        if (active.find.text) findRun(active, 0);
      }
      function closeFind() {
        if (!active || !active.find.open) return;
        active.find.open = false;
        try { active.wv.stopFindInPage("keepSelection"); } catch {}
        paintFind();
        try { active.wv.focus(); } catch {}
      }
      function findStep(dir) {
        if (!active) return;
        if (!active.find.open || !active.find.text) return openFind();
        findRun(active, dir);
      }
      findIn.addEventListener("input", () => { if (!active) return; active.find.text = findIn.value; findRun(active, 0); });
      findIn.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); findStep(e.shiftKey ? -1 : 1); }
        else if (e.key === "Escape") { e.preventDefault(); closeFind(); }
      });
      $("findNext").onclick = () => findStep(1);
      $("findPrev").onclick = () => findStep(-1);
      $("findClose").onclick = () => closeFind();

      function closeTab(tab) {
        const i = tabs.indexOf(tab);
        if (i < 0) return;
        tab.wv.remove();
        tabs.splice(i, 1);
        if (tabs.length === 0) return void openNewTab(); // never leave the window tab-less
        if (active === tab) switchTo(tabs[Math.min(i, tabs.length - 1)]);
        else renderTabs();
      }

      function cycleTab(dir) {
        if (tabs.length < 2) return;
        switchTo(tabs[(tabs.indexOf(active) + dir + tabs.length) % tabs.length]);
      }

      // The address bar shows where a reader view came from, never the data: URL it is built on.
      function setUrlBar(t) { if (omniEditing && document.activeElement === urlInput && t === active) return; /* never overwrite what you are typing */ urlInput.value = t.reader ? "📖 Reader · " + t.reader : t.url; if (typeof paintStar === "function") paintStar(); }

      function tabLabel(t) {
        if (t.reader) return "📖 " + (t.title || hostOf(t.reader));
        if (t.title) return t.title;
        try { return new URL(t.url).host; } catch { return t.url ? t.url : "New Tab"; }
      }

      // The strip is reconciled, not rebuilt: replacing a tab's node would restart its throbber's
      // SMIL clock on every title or state change.
      function makeTabEl(t) {
        const el = document.createElement("div");
        el.className = "tab";
        const th = document.createElement("span"); th.className = "th";
        const tt = document.createElement("span"); tt.className = "tt";
        const x = document.createElement("span"); x.className = "x"; x.textContent = "×";
        x.onclick = (e) => { e.stopPropagation(); closeTab(t); };
        el.append(th, tt, x);
        el.onclick = () => switchTo(t);
        el.onauxclick = (e) => { if (e.button === 1) closeTab(t); };
        return el;
      }

      function renderTabs() {
        const bar = $("tabs");
        const keep = new Set();
        for (const t of tabs) {
          if (!t.el) t.el = makeTabEl(t);
          keep.add(t.el);
          t.el.classList.toggle("on", t === active);
          t.el.title = t.thText || t.url || "New Tab";
          t.el.querySelector(".tt").textContent = tabLabel(t);
          if (t.el.parentNode !== bar) bar.appendChild(t.el);
          paintThrobber(t.el.querySelector(".th"), t.thState, t.paid);
        }
        for (const el of [...bar.children]) if (!keep.has(el)) el.remove();
        document.title = active ? tabLabel(active) + " — dbbasic-browser" : "dbbasic-browser";
        syncTabs();
      }

      // ---- what is this tab doing? (throbbers + status line) -------------------------------------
      // Driven by REAL signals only: the webview's load events, per-request progress from our own
      // transport (request out, headers in, bytes, redirect, error), and the x402 engine's events.
      // DNS/TCP/TLS are invisible to us (they happen inside Chromium), so they show as "waiting".
      const THROBBERS = /*__THROBBERS__*/ {};
      // Downloads are not tied to one tab: the status line shows the most recent active one, whichever tab is in front.
      const downloads = new Map();
      function downloadStatus() {
        const active = [...downloads.values()].filter((d) => d.state === "progressing" || d.state === "paused");
        if (!active.length) return null;
        const d = active[active.length - 1];
        const of = d.total > 0 ? " of " + fmtBytes(d.total) : "";
        const more = active.length > 1 ? " (+" + (active.length - 1) + " more)" : "";
        return { state: "receiving", text: "⬇ Downloading " + d.name + " — " + fmtBytes(d.received) + of + more };
      }
      const SLOW_MS = 6000;
      // Default: follow the OS "Reduce motion" setting. View ▸ Loading Animations can override it
      // (Always / Never) for anyone who wants to.
      const reducedMotionMQ = matchMedia("(prefers-reduced-motion: reduce)");
      let motionMode = "system";
      try { motionMode = localStorage.getItem("dbb.motion") || "system"; } catch {}
      const animating = () => motionMode === "always" || (motionMode === "system" && !reducedMotionMQ.matches);
      function applyMotion() {
        for (const svg of document.querySelectorAll(".th svg, #status .ic svg")) {
          if (animating()) svg.unpauseAnimations && svg.unpauseAnimations();
          else svg.pauseAnimations && svg.pauseAnimations();
        }
      }
      function setMotionMode(m) {
        if (!["always", "system", "never"].includes(m)) return;
        motionMode = m;
        try { localStorage.setItem("dbb.motion", m); } catch {}
        window.x402.reportMotion(m); // so the View menu's radio check follows
        applyMotion();
      }
      reducedMotionMQ.addEventListener("change", applyMotion);
      window.x402.reportMotion(motionMode);
      const fmtBytes = (n) => (n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(0) + " KB" : (n / 1048576).toFixed(1) + " MB");

      function computeState(tab) {
        const now = Date.now();
        const reqs = [...tab.net.reqs.values()];
        const host = hostOf(tab.url) || (reqs[0] && hostOf(reqs[0].url)) || "";
        const rows = [...tab.rows.values()];
        const price = (r) => (r.quote ? r.quote.price : "");
        if (tab.failed) {
          if (/INTERNET_DISCONNECTED|NETWORK_CHANGED/.test(tab.failed.desc)) return { state: "offline", text: "You're offline" };
          return { state: "failed", text: "Couldn't load " + (host || "the page") + ": " + (tab.failed.desc || "error") };
        }
        if (tab.aiBusy) return { state: "summarizing", text: "Summarizing with " + tab.aiBusy + "…" };
        const pend = rows.find((r) => r.decision === "prompt" && !r.outcome);
        if (pend) return { state: "pay-pending", text: price(pend) + " payment needed on " + hostOf(pend.resource) + " — waiting for your approval" };
        const paying = rows.find((r) => r.decision === "allow" && !r.outcome);
        if (paying) return { state: "pay-paying", text: "Paying " + price(paying) + " to " + hostOf(paying.resource) + "…" };
        if (tab.settledUntil > now) {
          const paid = rows.filter((r) => r.outcome === "paid").pop();
          return { state: "pay-settled", text: "Paid " + (paid ? price(paid) : "") + " ✓" };
        }
        if (tab.loading) { // network phases only mean something while the page is loading
          if (/\.within\.website/.test(tab.url) || reqs.some((r) => r.url.includes(".within.website"))) {
            return { state: "challenge", text: "Checking your browser with " + host + " (a short proof of work)…" };
          }
          if (tab.redirect && tab.redirect.until > now) return { state: "redirecting", text: "Redirecting to " + tab.redirect.to };
          const waiting = reqs.filter((r) => r.phase === "waiting");
          if (waiting.length) {
            const age = now - Math.min(...waiting.map((r) => r.t0));
            const secs = (age / 1000).toFixed(age >= 10000 ? 0 : 1);
            const h = hostOf(waiting[0].url);
            return age > SLOW_MS ? { state: "slow", text: "Still waiting for " + h + "… " + secs + "s" } : { state: "waiting", text: "Waiting for " + h + "… " + secs + "s" };
          }
          const recv = reqs.filter((r) => r.phase === "receiving");
          if (recv.length) return { state: "receiving", text: "Receiving from " + hostOf(recv[0].url) + "… " + fmtBytes(recv.reduce((a, r) => a + (r.bytes || 0), 0)) };
          return { state: "connecting", text: "Connecting to " + host + "…" };
        }
        return { state: null, text: "" };
      }

      function paintThrobber(slot, state, paid) {
        const key = state || (paid ? "paid" : "");
        if (slot.dataset.k === key) return; // same state: leave the node alone so its animation keeps running
        slot.dataset.k = key;
        slot.textContent = "";
        if (state && THROBBERS[state]) {
          slot.innerHTML = THROBBERS[state]; // trusted: our own SVGs, inlined at build time
          const svg = slot.firstElementChild;
          if (!animating() && svg && svg.pauseAnimations) svg.pauseAnimations();
        } else if (paid) slot.textContent = "⚡";
      }

      // The address of the link under the pointer, in the status area, coloured by whether it stays on this site.
      // (Approximation: same host, or same last two labels — three for names like example.co.uk.)
      const siteOf = (host) => { const p = host.split("."); const n = p.length >= 3 && p[p.length - 1].length === 2 && p[p.length - 2].length <= 3 ? 3 : 2; return p.slice(-n).join("."); };
      function sameSite(a, b) {
        try { const x = new URL(a), y = new URL(b); return x.hostname === y.hostname || (/^https?:$/.test(x.protocol) && /^https?:$/.test(y.protocol) && siteOf(x.hostname) === siteOf(y.hostname)); } catch { return false; }
      }
      function paintLink() {
        const el = $("link"), href = active && active.hoverLink;
        if (!href) { el.className = ""; el.textContent = ""; return; }
        let cur = ""; try { cur = active.wv.getURL(); } catch {}
        const same = sameSite(href, cur);
        el.className = "show " + (same ? "same" : "other");
        const k = document.createElement("span"); k.className = "k"; k.textContent = same ? "● this site" : "↗ other site"; // not colour alone
        el.replaceChildren(k, document.createTextNode(href));
        el.title = href;
      }

      function refreshThrobber(tab) {
        const { state, text } = computeState(tab);
        const changed = tab.thState !== state;
        tab.thState = state;
        tab.thText = text;
        if (tab.el) paintThrobber(tab.el.querySelector(".th"), state, tab.paid);
        if (tab === active) {
          const st = $("status");
          const dl = state ? null : downloadStatus(); // the tab's own state wins; otherwise show a download in progress

          const complete = typed === r.line || /\s/.test(typed);
          if (!complete || (!r.ready && !/\s/.test(typed) && r.arg)) { omniComplete(r); return; }
          if (!r.ready) { omniLocal = [{ kind: "notice", text: "/" + r.name + ": " + (r.problem || "cannot run yet") }, ...omniLocal.filter((x) => x.kind !== "notice")]; omniRender(); return; }
          omniRunCmd(/\s/.test(typed) ? typed : r.line);
          return;
        }
        if (r.kind === "notice") { if (r.connect) { omniEnd(); setUrlBar(active); setChat(true); } return; }
        omniEnd();
        if (r.kind === "tab") { const t = tabs.find((x) => x.id === r.id); if (t) { switchTo(t); return; } }
        if (r.kind === "ask") { setUrlBar(active); setChat(true); chatIn.value = r.text; chatSend(); return; }
        if (r.kind === "search" || r.kind === "suggest") { go(searchFor(r.text)); return; }
        go(r.url);
      }
      urlInput.addEventListener("input", (e) => {
        omniEditing = true;
        omniTyped = urlInput.value;
        omniUpdate(!/^delete/.test(e.inputType || "")); // no completing while you delete
      });
      urlInput.addEventListener("blur", () => setTimeout(() => { if (document.activeElement !== urlInput) { omniClose(); omniEditing = false; } }, 0));
      urlInput.addEventListener("keydown", (e) => {
        const open = omni.classList.contains("open") && omniRows.length;
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          if (!open) return;
          e.preventDefault();
          omniSel = (omniSel + (e.key === "ArrowDown" ? 1 : -1) + omniRows.length) % omniRows.length;
          omniPaintSel();
          return;
        }
        if (e.key === "Tab" && open && omniTyped.trim().startsWith("/")) {
          const r = omniRows[omniSel];
          if (r && r.kind === "cmd") { e.preventDefault(); omniComplete(r); }
          return;
        }
        if (e.key === "Escape") {
          omniConfirm = null;
          if (open) { omniClose(); if (urlInput.value !== omniTyped && omniEditing) urlInput.value = omniTyped; }

          return;
        }
        if (e.key === "Enter" && !e.isComposing) {
          e.preventDefault();
          if (urlInput.value.trim().startsWith("/")) {
            // a command never becomes a search
            const r = open ? omniRows[omniSel] : null;
            if (r && (r.kind === "cmd" || r.kind === "notice")) omniPick(r);
            else if (!open && /\s/.test(urlInput.value.trim())) omniRunCmd(urlInput.value.trim()); // pressed before the list arrived
            return;
          }
          if (open && omniSel > 0) { omniPick(omniRows[omniSel]); return; }
          if (omniRows[0] && omniRows[0].kind === "go" && omniFilled && urlInput.value === omniFilled) { omniPick(omniRows[0]); return; } // the completed site, with its own scheme
          const v = urlInput.value;
          omniEnd();
          go(v);
        }
      });
      // ⌘K belongs to the page (askrobots' own search box uses it): when the address bar or the browser has the focus — as
      // right after a new tab — hand it to the page instead of swallowing it.
      document.addEventListener("keydown", (e) => {
        if (!(e.metaKey || e.ctrlKey) || e.shiftKey || e.altKey || (e.key || "").toLowerCase() !== "k") return;
        if (document.activeElement === chatIn || !active || !active.ready) return;
        e.preventDefault();
        omniEnd(); setUrlBar(active);
        try {
          active.wv.focus();
          const mods = [e.metaKey ? "meta" : "control"];
          active.wv.sendInputEvent({ type: "keyDown", keyCode: "K", modifiers: mods });
          active.wv.sendInputEvent({ type: "keyUp", keyCode: "K", modifiers: mods });
        } catch {}
      });
      // Reload, which becomes Stop while the page is loading.
      const RELOAD_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 6.2A5.5 5.5 0 1 0 13.5 9.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M13.6 2.2v4.3H9.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const STOP_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
      function paintReload() {
        const b = $("reload");
        if (!b) return;
        const loading = !!(active && active.loading);
        b.innerHTML = loading ? STOP_ICON : RELOAD_ICON; // our own constant markup, never page text
        b.setAttribute("aria-label", loading ? "Stop" : "Reload");
        b.title = loading ? "Stop loading" : "Reload (⌘R)";
      }
      paintReload();
      $("reload").onclick = () => { if (!active) return; try { active.loading ? active.wv.stop() : active.wv.reload(); } catch {} };
      $("back").onclick = () => { try { active.wv.canGoBack() && active.wv.goBack(); } catch {} };
      $("fwd").onclick = () => { try { active.wv.canGoForward() && active.wv.goForward(); } catch {} };

      function toast(cls, text, ms = 4000) {
        const n = document.createElement("div");
        n.className = "note " + cls;
        n.textContent = text;
        $("toast").appendChild(n);
        setTimeout(() => n.remove(), ms);
        return n;
      }

      // ---- password manager ------------------------------------------------
      // Secrets never reach this document: logins go page → main, fills go main → page.
      // We only ever see usernames, origins and ids.
      const vault = window.x402.vault;
      let vstate = { exists: false, unlocked: false, count: null };
      let vaultPanelOpen = false;
      let vaultMsg = ""; // transient error/info line inside the panel

      function h(tag, props, ...kids) {
        const el = document.createElement(tag);
        for (const [k, v] of Object.entries(props || {})) {
          if (k === "class") el.className = v;
          else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
          else el.setAttribute(k, v);
        }
        for (const kid of kids) el.append(kid == null ? "" : kid.nodeType ? kid : document.createTextNode(String(kid)));
        return el;
      }
      const hostOf = (u) => { try { return new URL(u).host; } catch { return u; } };

      function applyVaultState(st) {
        vstate = st;
        $("keyBtn").classList.toggle("unlocked", st.unlocked);
        $("keyBtn").title = st.unlocked ? `Passwords — unlocked (${st.count} saved)` : st.exists ? "Passwords — locked" : "Passwords — set up";
        if (vaultPanelOpen) renderVaultPanel();
        renderOffer();
      }
      vault.state().then(applyVaultState);
      vault.onState(applyVaultState);

      function setVaultPanel(open) {
        vaultPanelOpen = open;
        $("vaultPanel").classList.toggle("open", open);
        $("keyBtn").classList.toggle("on", open);
        if (open) { vaultMsg = ""; renderVaultPanel(); }
      }
      $("keyBtn").onclick = () => setVaultPanel(!vaultPanelOpen);
      document.addEventListener("keydown", (e) => { if (e.key === "Escape" && vaultPanelOpen) setVaultPanel(false); });

      async function renderVaultPanel() {
        const P = $("vaultPanel");
        P.innerHTML = "";
        const err = () => (vaultMsg ? h("div", { class: "err" }, vaultMsg) : "");

        if (!vstate.exists) {
          const m1 = h("input", { type: "password", placeholder: "Master password (8+ characters)", autocomplete: "off" });
          const m2 = h("input", { type: "password", placeholder: "Confirm master password", autocomplete: "off" });
          const go = async () => {
            if (m1.value !== m2.value) { vaultMsg = "Passwords don't match."; return renderVaultPanel(); }
            const r = await vault.create(m1.value);
            vaultMsg = r.ok ? "" : r.message;
            if (!r.ok) renderVaultPanel();
          };
          m2.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
          P.append(h("h4", {}, "🔑 Set up your password vault"),
            h("div", { class: "hint" }, "Passwords are encrypted on this computer with your master password. There is no recovery if you forget it, and nothing is sent anywhere."),
            m1, m2, err(), h("button", { class: "sbtn", onclick: go }, "Create vault"));
          m1.focus();
          return;
        }

        if (!vstate.unlocked) {
          const m = h("input", { type: "password", placeholder: "Master password", autocomplete: "off" });
          const go = async () => {
            const r = await vault.unlock(m.value);
            vaultMsg = r.ok ? "" : r.message;
            if (!r.ok) renderVaultPanel();
          };
          m.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
          P.append(h("h4", {}, "🔑 Vault locked"), m, err(), h("button", { class: "sbtn", onclick: go }, "Unlock"));
          m.focus();
          return;
        }

        const siteRes = active && active.wcId != null ? await vault.list(active.wcId) : { ok: true, data: [] };
        const allRes = await vault.list();
        if (!vaultPanelOpen || !vstate.unlocked) return; // state changed while we awaited
        P.innerHTML = "";
        const site = siteRes.ok ? siteRes.data : [];
        const all = allRes.ok ? allRes.data : [];
        const host = active && active.url ? hostOf(active.url) : "";

        P.append(h("h4", {}, `🔑 ${all.length} saved`, h("span", { class: "sp" }), h("button", { class: "sbtn quiet", onclick: () => vault.lock() }, "Lock")));
        if (vaultMsg) P.append(h("div", { class: "err" }, vaultMsg));

        if (host) {
          P.append(h("div", { class: "sec" }, "This site · " + host));
          if (!site.length) P.append(h("div", { class: "hint" }, "No saved login for this exact site."));
          for (const c of site) {
            P.append(h("div", { class: "cred" },
              h("div", { class: "who" }, c.username || "(no username)"),
              h("button", { class: "sbtn", onclick: () => doFill(c.id, false) }, "Fill"),
              h("button", { class: "sbtn", onclick: () => doFill(c.id, true) }, "Sign in")));
          }
          // Manual add for the current page.
          const u = h("input", { placeholder: "Username or email", autocomplete: "off" });
          const pw = h("input", { type: "password", placeholder: "Password", autocomplete: "off" });
          P.append(h("div", { class: "sec" }, "Save a login for this site"), u,
            h("div", { class: "row2" }, pw, h("button", { class: "sbtn quiet", onclick: async () => { pw.type = "text"; pw.value = await vault.generate(20); } }, "Generate")),
            h("button", { class: "sbtn", onclick: async () => {
              if (!pw.value) return;
              const r = await vault.add({ wcId: active.wcId, username: u.value, password: pw.value });
              vaultMsg = r.ok ? "" : r.message;
              if (r.ok) toast("quoted", "Saved " + (u.value || "login") + " for " + host, 2500);
              renderVaultPanel();
            } }, "Save"));
        }

        P.append(h("div", { class: "sec" }, "All logins"));
        if (!all.length) P.append(h("div", { class: "hint" }, "Nothing saved yet. Sign in to a site and you'll be offered to save it."));
        for (const c of all) {
          P.append(h("div", { class: "cred" },
            h("div", { class: "who" }, c.username || "(no username)", h("small", {}, c.origin)),

              renderVaultPanel();
            } }, "✕")));

      }

      async function doFill(id, submit) {
        if (!active || active.wcId == null) return;
        const r = await vault.fill({ wcId: active.wcId, id, submit });
        if (r.ok) { toast("quoted", (submit ? "Signing in as " : "Filled ") + (r.data.username || "login"), 2200); setVaultPanel(false); }
        else { vaultMsg = r.message; if (vaultPanelOpen) renderVaultPanel(); else toast("skipped", r.message); }
      }

      // Offers pushed from main (page has a login form we know / user just submitted one).
      vault.onOffer((o) => {
        const tab = tabs.find((t) => t.wcId === o.wcId);
        if (!tab) return;
        if (o.kind === "save") {
          tab.saveOffer = o;
          // Same lifetime as the main-process copy of the pending login; don't nag forever.
          setTimeout(() => { if (tab.saveOffer === o) { tab.saveOffer = null; if (tab === active) renderOffer(); } }, 120000);
        } else tab.fillOffer = o;
        if (tab === active) renderOffer();
      });

      function renderOffer() {
        const bar = $("offerbar");
        bar.innerHTML = "";
        const t = active;
        if (!t) return void bar.classList.remove("show");
        const close = (which) => h("button", { class: "sbtn quiet", onclick: () => {
          if (which === "save") { vault.dismiss(t.wcId); t.saveOffer = null; } else t.fillOffer = null;
          renderOffer();
        } }, which === "save" ? "Not now" : "✕");

        if (t.saveOffer) {
          const o = t.saveOffer;

          const canSave = vstate.unlocked; // mode may be stale (e.g. "locked" before the user unlocked)

            ? h("button", { class: "sbtn", onclick: async () => {

            : h("button", { class: "sbtn", onclick: () => setVaultPanel(true) }, !vstate.exists ? "Create vault…" : "Unlock…");

      // ---- guided tour -----------------------------------------------------
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      function cheapest(quotes) {

      function statusOf(e) {

               <div class="step">Decision</div>
               <dl><dt>action</dt><dd>${e.decision || "—"}</dd><dt>reason</dt><dd>${e.reason || "—"}</dd></dl>
               ${e.outcome === "paid" && e.auth ? `<div class="step">Signed authorization (EIP-3009)</div>
                 <dl>
                   <dt>from</dt><dd>${e.auth.from}</dd>
                   <dt>to</dt><dd>${e.auth.to}</dd>

      function upsert(resource, patch) {
        const t = ownerOf(resource);
        const e = t.rows.get(resource) || { resource };
        Object.assign(e, patch);
        t.rows.set(resource, e);
        if (patch.outcome === "paid") t.settledUntil = Date.now() + 2500;
        if (patch.outcome === "paid" && !t.paid) { t.paid = true; renderTabs(); }
        refreshThrobber(t);
        if (t !== active) return; // background tab: record it, don't disturb the one in front
        if (!inspectorOpen && !t.userClosed) setInspector(true); // surface payment activity
        renderInspector();
      }

      // Log a terminal outcome (paid / refused) to the persistent session history.
      function logHistory(resource) {
        const e = ownerOf(resource).rows.get(resource);
        if (!e) return;
        const st = statusOf(e);
        history.unshift({
          resource,
          price: e.quote ? e.quote.price : "—",
          label: st.label,
          cls: st.cls,
          at: new Date().toLocaleTimeString(),
        });
        if (view === "session") renderInspector();
      }

      window.x402.onEvent((ev) => {
        // "quoted" opens a resource's lifecycle (quoted → decided → paid). Drop any stale
        // tab mapping so a second tab loading the same URL isn't credited to the first.
        if (ev.kind === "quoted") owners.delete(ev.resource);
        if (ev.kind === "quoted") {
          const c = cheapest(ev.quotes);
          upsert(ev.resource, { quote: c, quotes: ev.quotes, rejected: ev.rejected });
          if (c) toast("quoted", `Price: ${c.price} ${c.asset} — ${shortPath(ev.resource)}`, 2500);
        } else if (ev.kind === "decided") {
          upsert(ev.resource, { decision: ev.action, reason: ev.reason });
        } else if (ev.kind === "paid") {
          const meter = $("meter");
          meter.textContent = ev.totalSpent;
          meter.classList.toggle("zero", ev.totalSpent === "$0.00");
          upsert(ev.resource, { outcome: "paid", paidStatus: ev.status, nonce: ev.nonce, validBefore: ev.validBefore, tx: ev.tx, requested: ev.requested, auth: ev.auth, signature: ev.signature });
          logHistory(ev.resource);
          toast("paid", `Paid ${ev.amount} ${ev.asset} → ${new URL(ev.dest).host}${ev.tx ? " ✓" : ""}`);
        } else if (ev.kind === "net-provider-changed") {
          $("cn").classList.toggle("show", !!ev.enabled);
        } else if (ev.kind === "auto-decision") {
          // Automation answered a payment prompt - never silent.
          toast(ev.approved ? "quoted" : "skipped", "🤖 " + (ev.approved ? "Auto-approved " : "Auto-declined ") + ev.price + " (" + ev.mode + ", cap $" + ev.cap + ") - " + shortPath(ev.resource), 5000);
        } else if (ev.kind === "download") {
          const prev = downloads.get(ev.id);
          downloads.set(ev.id, ev);
          if (active) refreshThrobber(active);
          const finished = !prev || prev.state === "progressing" || prev.state === "paused";
          if (finished && ev.state === "completed") {
            toast("paid", "⬇ Saved " + ev.name + " (" + fmtBytes(ev.total || ev.received) + ")" + (ev.paid ? " · paid " + ev.paid : "") + " — File ▸ Show Last Download in Finder", 7000);
          } else if (finished && ev.state === "interrupted") {
            toast("skipped", "⬇ Download failed: " + ev.name, 6000);
          }
        } else if (ev.kind === "reader-busy") {
          const t = tabs.find((x) => x.wcId === ev.wcId);
          if (t) { t.aiBusy = ev.busy ? (ev.provider + (ev.model ? " · " + ev.model : "")) : null; refreshThrobber(t); }
        } else if (ev.kind === "ai-summary") {
          // Never silent: what left this computer, to whom, and what it cost.
          const cost = ev.costUsd == null ? "" : " · ≈$" + (ev.costUsd < 0.01 ? ev.costUsd.toFixed(4) : ev.costUsd.toFixed(3));
          toast("quoted", "📖 Sent " + ev.sentChars.toLocaleString() + " characters from " + ev.host + " to " + ev.provider + " (" + ev.model + ") · " + (ev.ms / 1000).toFixed(1) + "s" + cost, 7000);
        } else if (ev.kind === "ai-error") {
          toast("skipped", "📖 Summary failed (" + ev.provider + "): " + ev.message, 7000);
        } else if (ev.kind === "ai-provider") {
          toast("quoted", "📖 AI provider: " + ev.provider + " · " + ev.model, 3500);
        } else if (ev.kind === "approval-changed") {
          toast("quoted", "🤖 Payment approval set to " + ev.mode + (ev.mode === "auto" ? " up to $" + ev.maxUsd : ""), 5000);
        } else if (ev.kind === "skipped") {
          upsert(ev.resource, { outcome: "skipped", skipReason: ev.reason });
          logHistory(ev.resource);
          toast("skipped", `Skipped: ${ev.reason}`);
        }
      });

      window.x402.spent().then((s) => {
        const meter = $("meter");
        meter.textContent = s;
        meter.classList.toggle("zero", s === "$0.00");
      });

      // ---- wallet balance + funding ----------------------------------------
      let walletAddress = "";
      window.x402.wallet().then(({ address }) => { walletAddress = address || ""; });
      window.x402.onBalance(({ usdc, address, merchantUsdc, merchantAddress }) => {
        walletAddress = address || walletAddress;
        const b = $("bal");
        b.textContent = usdc == null ? "◈ —" : "◈ " + usdc + " USDC";
        b.classList.toggle("funded", usdc != null && parseFloat(usdc) > 0);
        const mb = $("mbal");
        if (merchantAddress && merchantUsdc != null) {
          mb.style.display = "";
          mb.textContent = "🏪 " + merchantUsdc;
          mb.title = "Merchant wallet " + merchantAddress + " — live payments land here";
          const earning = parseFloat(merchantUsdc) > 0;
          mb.classList.toggle("earning", earning);
          $("refundBtn").style.display = earning ? "" : "none";
        }
      });
      $("bal").onclick = async () => {
        if (!walletAddress) return;
        await window.x402.copy(walletAddress);
        toast("quoted", "Address copied: " + walletAddress.slice(0, 12) + "…", 2200);
      };
      $("fundBtn").onclick = () => {
        window.x402.fund();
        toast("quoted", "Address copied — faucet opened in your browser. Pick Base Sepolia.", 4500);
      };
      $("refundBtn").onclick = async () => {
        const btn = $("refundBtn");
        btn.disabled = true;
        btn.textContent = "Refunding…";
        try {
          const r = await window.x402.refund();
          if (r && r.tx) toast("paid", "Refunded → you. tx " + r.tx.slice(0, 14) + "… ✓");
          else toast("skipped", "Refund: " + ((r && r.error) || "nothing to refund"));
        } finally {
          btn.disabled = false;
          btn.textContent = "Refund";
        }
      };

      // First tab opens on the homepage; go() defers the navigation until dom-ready.
      newTab(window.x402.homepage || null);
      if (!window.x402.homepage) urlInput.focus();
    </script>
  </body>
</html>
